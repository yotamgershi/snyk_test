name: Snyk Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'

jobs:
  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Snyk to check for vulnerabilities
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high --json-file-output=snyk-report.json
      continue-on-error: true

    - name: Run Snyk to check for license issues
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high --json-file-output=snyk-license-report.json --command=test --package-manager=npm
      continue-on-error: true

    - name: Upload Snyk report to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: snyk.sarif

    - name: Comment PR with Snyk results
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request' && always()
      with:
        script: |
          const fs = require('fs');
          try {
            const report = JSON.parse(fs.readFileSync('snyk-report.json', 'utf8'));
            const issues = report.vulnerabilities || [];
            const highIssues = issues.filter(issue => issue.severity === 'high');
            const mediumIssues = issues.filter(issue => issue.severity === 'medium');
            const lowIssues = issues.filter(issue => issue.severity === 'low');
            
            const comment = `## 🔒 Snyk Security Scan Results
            
            **Vulnerabilities Found:**
            - 🔴 High: ${highIssues.length}
            - 🟡 Medium: ${mediumIssues.length}
            - 🟢 Low: ${lowIssues.length}
            
            ${highIssues.length > 0 ? '⚠️ **High severity vulnerabilities detected!** Please review and fix these issues.' : '✅ No high severity vulnerabilities found.'}
            
            [View detailed report in Snyk](https://app.snyk.io/org/${process.env.GITHUB_REPOSITORY_OWNER}/project/${process.env.GITHUB_REPOSITORY})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.log('Could not parse Snyk report or create comment:', error.message);
          } 